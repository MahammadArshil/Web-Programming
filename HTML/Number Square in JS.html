<html>
<head>
	<title>Practical-16</title>
    <script type="text/javascript">
        function square(){
            var x=parseInt(prompt("Enter a number","Number"));
            var msg="";
            var res="0";
            for(var i=1;i<(x+1);i++){
                res = i*i;
                msg=msg+" "+i+" * "+i+" = "+res+"\n";
            }
            alert(msg);
        }
    </script>
</head>
<body onload="square()">
    
</body>
</html>

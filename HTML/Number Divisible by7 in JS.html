<html>
    <head>
        <title>Practical-18</title>
        <script type="text/javascript">
            var x=parseInt(prompt("Enter Any Number","Number Only"));
            document.write("<table border=2>");
            document.write("<th>Sr.No.</th>");
            document.write("<th>Numbers</th>");
            var a=1;
            for(i=1;i<=x;i++){
                if(i%7==0){
                    document.write("<tr><td align='center'>");
                    document.write(a);
                    a=a+1;
                    document.write("</td>");
                    document.write("<td align='center'>");
                    document.write(i);
                    document.write("</td></tr>");
                }
            }
            document.write("</table>");
        </script>
    </head>
    <body>

    </body>
</html>
